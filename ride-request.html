<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Wild Rydes 유니콘 호출</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .box { max-width: 720px; margin: 0 auto; }
    label { display: block; margin-top: 16px; font-weight: bold; }
    input { width: 100%; padding: 10px; margin-top: 6px; }
    button { margin-top: 20px; padding: 12px 18px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 16px; margin-top: 20px; overflow: auto; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🦄 Wild Rydes 유니콘 호출</h1>
    <p>로그인 후 탑승 요청을 저장합니다.</p>

    <button id="loginBtn">로그인</button>
    <button id="logoutBtn">로그아웃</button>

    <label for="pickup">출발지</label>
    <input id="pickup" type="text" value="Gangnam Station" />

    <label for="dropoff">도착지</label>
    <input id="dropoff" type="text" value="Jamsil Station" />

    <button id="requestBtn">유니콘 호출 요청 저장</button>

    <pre id="result">결과가 여기에 표시됩니다.</pre>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ride-api.js"></script>
  <script>
    const result = document.getElementById("result");

    function refreshAuthStatus() {
      const loggedIn = window.WildRydesAuth.isLoggedIn();
      result.textContent = loggedIn
        ? "로그인 상태입니다. 유니콘 호출 요청을 보낼 수 있습니다."
        : "아직 로그인하지 않았습니다.";
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      await window.WildRydesAuth.login();
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      window.WildRydesAuth.logout();
    });

    document.getElementById("requestBtn").addEventListener("click", async () => {
      try {
        if (!window.WildRydesAuth.isLoggedIn()) {
          await window.WildRydesAuth.login();
          return;
        }

        const pickup = document.getElementById("pickup").value.trim();
        const dropoff = document.getElementById("dropoff").value.trim();

        const response = await window.WildRydesApi.requestRide({ pickup, dropoff });
        result.textContent = JSON.stringify(response, null, 2);
      } catch (e) {
        result.textContent = `오류: ${e.message}`;
      }
    });

    refreshAuthStatus();
  </script>
</body>
</html>
